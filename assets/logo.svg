<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Architecture Paper Writing Logo">
  <defs>
    <linearGradient id="chipBg" x1="18" y1="18" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="nibGrad" x1="68" y1="64" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Subtle high-contrast chip pins (10% outer margin kept clear) -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <!-- Top pins -->
    <line x1="40" y1="15" x2="40" y2="25"/>
    <line x1="56" y1="15" x2="56" y2="25"/>
    <line x1="72" y1="15" x2="72" y2="25"/>
    <line x1="88" y1="15" x2="88" y2="25"/>
    <!-- Bottom pins -->
    <line x1="40" y1="103" x2="40" y2="113"/>
    <line x1="56" y1="103" x2="56" y2="113"/>
    <!-- Left pins -->
    <line x1="15" y1="40" x2="25" y2="40"/>
    <line x1="15" y1="56" x2="25" y2="56"/>
    <line x1="15" y1="72" x2="25" y2="72"/>
    <line x1="15" y1="88" x2="25" y2="88"/>
    <!-- Right pins -->
    <line x1="103" y1="40" x2="113" y2="40"/>
    <line x1="103" y1="56" x2="113" y2="56"/>
  </g>

  <!-- Main silicon package body -->
  <rect x="25" y="25" width="78" height="78" rx="14" fill="url(#chipBg)" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- Inner manuscript / die-grid card -->
  <rect x="35" y="35" width="52" height="58" rx="6" fill="#F8FAFC" opacity="0.96"/>

  <!-- Two-column academic paper lines + mini architecture block -->
  <rect x="41" y="42" width="40" height="5" rx="2.5" fill="#1E3A8A"/>
  <rect x="41" y="51" width="18" height="12" rx="2.5" fill="#0D9488" opacity="0.88"/>
  <rect x="63" y="51" width="18" height="3.5" rx="1.75" fill="#64748B"/>
  <rect x="63" y="58" width="14" height="3.5" rx="1.75" fill="#94A3B8"/>
  <rect x="41" y="68" width="18" height="3.5" rx="1.75" fill="#64748B"/>
  <rect x="41" y="75" width="16" height="3.5" rx="1.75" fill="#94A3B8"/>
  <rect x="41" y="82" width="18" height="3.5" rx="1.75" fill="#64748B"/>
  <rect x="63" y="68" width="15" height="3.5" rx="1.75" fill="#94A3B8"/>

  <!-- Crisp fountain-pen nib badge overlaying bottom-right corner -->
  <g>
    <path d="M111 111 L73 95 L82 78 L95 73 Z" fill="url(#nibGrad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="89" y1="89" x2="108" y2="108" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="88" cy="88" r="3.5" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
